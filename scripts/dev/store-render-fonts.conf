<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Store composition renders (scripts/dev/export-store-assets.ts): leave out the image's own CJK fonts,
     so only the mounted Windows fonts (Arial, Yu Gothic, Microsoft YaHei, named by the pages) are used. -->
<fontconfig>
  <selectfont><rejectfont>
    <glob>/usr/share/fonts/truetype/wqy/*</glob>
    <glob>/usr/share/fonts/opentype/ipafont-gothic/*</glob>
    <glob>/usr/share/fonts/opentype/unifont/*</glob>
  </rejectfont></selectfont>
</fontconfig>
