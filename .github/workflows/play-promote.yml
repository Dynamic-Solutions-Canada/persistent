name: Play Promote

# Recover an already-uploaded version onto production without rebuilding.
# Retire phone testing releases in the same edit. Normal tagged releases publish
# directly to production; this manual path also adjusts a production rollout.
#
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'versionCode to promote (must already be on a Play track)'
        required: true
        type: string
      rollout:
        description: 'Staged rollout fraction, e.g. 0.2 for 20%. Leave empty to release to everyone.'
        required: false
        type: string

permissions:
  contents: read

# Publishes, so a run in progress is never cancelled. The group is per workflow:
# GitHub drops an already-pending run when a third joins a group, and a group
# shared across the Play workflows could drop a queued release that way.
concurrency:
  group: play-promote
  cancel-in-progress: false

jobs:
  # CI-4: publishing starts only once the gate passes for the same commit.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml

  promote:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # about 3x the slowest recent run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No `npm ci`: the script is dependency-free by design (Node 22 has fetch
      # and RS256 signing built in), so this needs nothing from the workspace.
      - name: Promote versionCode ${{ inputs.version_code }} to production
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs --promote \
            --version-code '${{ inputs.version_code }}' \
            --tracks production --production-only \
            ${{ inputs.rollout && format('--rollout ''{0}''', inputs.rollout) || '' }}
