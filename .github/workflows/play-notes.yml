name: Play Notes

# Rewrite the "what's new" of a release already on Google Play, from the approved notes files
# in release-notes/ (REL-6), for example after a translation fix was committed. It writes every
# wording to the tracks that carry that build and touches nothing else, including a staged
# rollout's fraction. The notes are never generated from commits.
#
# Run `play-check` first if you need to know which versionCode is on which track.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose notes to republish, e.g. android-v0.31.0 (or v0.30.1 for releases before the Android lane)'
        required: true
        type: string
      version_code:
        description: 'versionCode of that release on Play (play-check prints these)'
        required: true
        type: string

permissions:
  contents: read

# Publishes, so a run in progress is never cancelled. The group is per workflow:
# GitHub drops an already-pending run when a third joins a group, and a group
# shared across the Play workflows could drop a queued release that way.
concurrency:
  group: play-notes
  cancel-in-progress: false

jobs:
  # CI-4: play-notes publishes store text, which the code gate says nothing about, so the gate is
  # the check of the notes files it sends.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:notes

  notes:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # about 3x the slowest recent run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # android-vX.Y.Z is the Android lane; releases tagged vX.Y.Z before it are the product lane.
      - name: Notes for ${{ inputs.tag }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^(android-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$TAG is not a release tag"; exit 1; }
          NAME="${TAG#android-}"
          NAME="${NAME#v}"
          LANE=product
          [[ "$TAG" == android-v* ]] && LANE=android
          node scripts/release/notes.mjs play-json "$LANE" "$NAME" > "$RUNNER_TEMP/play-notes.json"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      # No `npm ci`: play-publish.mjs is dependency-free by design (Node 22 has
      # fetch and RS256 signing built in), so this needs nothing from the workspace.
      - name: Write them to production
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs --set-notes \
            --version-code '${{ inputs.version_code }}' \
            --tracks production \
            --version-name "$VERSION_NAME" \
            --localized-notes "$RUNNER_TEMP/play-notes.json"
