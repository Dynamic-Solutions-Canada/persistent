name: Release

# An android-vX.Y.Z tag (the Android lane, REL-3) builds the Play AAB and publishes it to
# production. GitHub receives only the universal APK generated and signed by Google Play, after
# identity verification. PLAY_SERVICE_ACCOUNT_JSON is required; never fall back to the retired
# direct APK. Plain vX.Y.Z tags mean the product now: the deploy skill puts one on each production
# deploy, and they must never start this workflow. Older Android releases kept their v tags.

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build (android-vX.Y.Z, or vX.Y.Z for a release before the Android lane); the build uses that tag, not the branch'
        required: true
      play_status:
        description: "Play release status ('draft' holds the release in the Console instead of publishing it)"
        required: false
        default: completed
        type: choice
        options: [completed, draft]

# Least privilege (CI-5): read-only by default; the job widens it.
permissions:
  contents: read

# CI-6: Play allows one open edit per app, so edit-opening workflows queue here, never cancel, and queue: max keeps a waiting release from being dropped.
concurrency:
  group: google-play-edit
  cancel-in-progress: false
  queue: max

jobs:
  # CI-4: publishing starts only once the gate passes for the same commit.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.version || github.ref }}

  android:
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30 # about 3x the slowest recent run
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatch names a tag, so build *that* tag rather than whichever
          # branch the run was dispatched from, otherwise the artifact carries
          # the tag's version name but the branch's code.
          ref: ${{ github.event.inputs.version || github.ref }}
          submodules: true # web build bundles the shared promo catalog and icons

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          # android-vX.Y.Z is the Android lane (REL-3); older releases were tagged vX.Y.Z and
          # their notes are the product lane's.
          [[ "$TAG" =~ ^(android-)?v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          NAME="${TAG#android-}"
          NAME="${NAME#v}"
          LANE=product
          [[ "$TAG" == android-v* ]] && LANE=android
          # versionCode must strictly increase and never repeat across everything
          # ever published, on Play or as a sideload APK. The run number does that
          # on its own; PLAY_VERSION_CODE_OFFSET is the escape hatch for when a
          # manual upload already burned a higher code (the pre-flight below prints
          # the exact offset to set). Raise it only, lowering it re-burns codes.
          OFFSET="${{ vars.PLAY_VERSION_CODE_OFFSET || 0 }}"
          {
            echo "tag=${TAG}"
            echo "name=${NAME}"
            echo "lane=${LANE}"
            echo "code=$(( ${{ github.run_number }} + OFFSET ))"
            echo "tracks=production"
            echo "status=${{ github.event.inputs.play_status || 'completed' }}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # The approved notes for this version, committed before the tag (REL-6), in every wording.
      # A missing or over-long file stops the release here, before anything is built; nothing
      # is generated from commits or truncated.
      - name: Release notes for ${{ steps.ver.outputs.lane }} ${{ steps.ver.outputs.name }}
        run: |
          node scripts/release/notes.mjs require "${{ steps.ver.outputs.lane }}" "${{ steps.ver.outputs.name }}"
          node scripts/release/notes.mjs play-json "${{ steps.ver.outputs.lane }}" "${{ steps.ver.outputs.name }}" > "$RUNNER_TEMP/play-notes.json"
          node scripts/release/notes.mjs text "${{ steps.ver.outputs.lane }}" "${{ steps.ver.outputs.name }}" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Require Play publishing config
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ ! -f apps/mobile/scripts/play-apk.mjs ]; then
            echo "::error::This tag predates Play APK export. Use replace-github-apk for an existing Play release."
            exit 1
          fi
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is required for Play-signed GitHub APKs."
            exit 1
          fi

      # Runs before the Android build on purpose: versionCode is baked in at
      # assemble time, so a collision found here costs 20s instead of failing the
      # upload after a full build. Also proves the service account can reach the
      # app before anything is built.
      - name: Pre-flight Play release
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/play-publish.mjs --check --version-code ${{ steps.ver.outputs.code }}

      - name: Install workspace deps
        run: npm ci

      - name: Build web bundle
        run: |
          npm run build --workspace @persistent/shared
          npm run build --workspace @persistent/web

      - name: Install mobile deps
        working-directory: apps/mobile
        run: npm ci

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Gradle's dependency and wrapper caches, so a run downloads only what changed. Without it
      # every run pulled the whole tree from Maven Central and hit its per-IP rate limit (429).
      # `basic` is the open-source provider on the GitHub Actions cache. Runs off the default
      # branch (tags, PRs) only read the cache.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed Play bundle
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.ver.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.ver.outputs.code }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npx cap add android
          npm run setup:android
          # FCM client config: write google-services.json so the google-services
          # gradle plugin activates. Skipped (build still succeeds, FCM inert) when
          # the secret isn't set, e.g. on forks.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "wrote android/app/google-services.json"
          else
            echo "GOOGLE_SERVICES_JSON not set, building without FCM"
          fi
          npx cap sync android
          npm run bundle:play

      # Two things belong to the `direct` flavor alone and would each cost a Play
      # review if they leaked: REQUEST_INSTALL_PACKAGES (the self-updater signal
      # review rejects) and the Android Auto CarAppService (a templated car app has
      # to claim an approved Auto category, and a reminder app has none). The flavors
      # are one gradle or manifest typo apart, so assert rather than trust the wiring.
      - name: Verify the Play bundle carries no direct-only components
        working-directory: apps/mobile
        run: |
          # Located by search, not a fixed path: AGP moves packaged_manifests
          # between versions, and a stale path here would silently stop checking.
          # A marker that IS present fails the release; a manifest that cannot be
          # found only warns, so an AGP upgrade doesn't block shipping.
          #
          # The markers are every direct-only manifest entry, and each one is here
          # because it has cost something:
          #   REQUEST_INSTALL_PACKAGES: Play prohibits self-updating apps.
          #   androidx.car.app                catches the car screen and every component
          #                                   merged from the AndroidX Car App dependency;
          #                                   none belongs in the Play artifact.
          #   com.google.android.gms.car.application, the Auto *notification* mirror.
          #     Added after it slipped into the Play build and drew an Auto App Quality
          #     enforcement (2026-08-17): <uses name="notification"/> declares the app a
          #     messaging app, and review then tests it for sending and receiving
          #     messages, which a reminder app cannot pass. It is the reason to add a
          #     marker the moment a component becomes flavor-specific, this guard ran
          #     green for months while the entry shipped, because nothing listed it.
          #
          # Comments are stripped before matching, because they are not declarations:
          # src/main's manifest carries a note explaining where the Auto entry lives
          # now, and a plain grep counted that note as the entry itself, a guard that
          # fails every release on prose is worse than no guard, since the fix is to
          # weaken it.
          FOUND=0
          while IFS= read -r manifest; do
            FOUND=1
            DECLARATIONS=$(perl -0777 -pe 's/<!--.*?-->//gs' "$manifest")
            for marker in REQUEST_INSTALL_PACKAGES androidx.car.app com.google.android.gms.car.application; do
              COUNT=$(printf '%s' "$DECLARATIONS" | grep -c "$marker" || true)
              if [ "$COUNT" != "0" ]; then
                echo "::error::$manifest declares $marker ($COUNT), that component is direct-flavor only. See store-assets/play/play-readiness.md."
                exit 1
              fi
            done
            echo "clean (no direct-only components): $manifest"
          done < <(find android/app/build/intermediates/packaged_manifests -ipath '*playRelease*' -name AndroidManifest.xml 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "::warning::No playRelease packaged manifest found, direct-only component check skipped. See store-assets/play/play-readiness.md #1."
          fi

      - name: Stage Play bundle
        run: |
          cp apps/mobile/android/app/build/outputs/bundle/playRelease/app-play-release.aab \
             "persistent-${{ steps.ver.outputs.name }}-play.aab"

      # The AAB is a workflow artifact, not a release asset: it is for uploading to
      # the Play Console, and publishing it next to the installable APK would invite
      # installing the wrong one.
      - name: Upload Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: play-bundle-${{ steps.ver.outputs.name }}
          path: persistent-*-play.aab
          if-no-files-found: error

      # Every wording of the approved notes goes to Play's "What's new" (LIST-10).
      # Upload and testing-track retirement still share one production edit.
      - name: Release to Google Play
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs \
            --aab "$GITHUB_WORKSPACE/persistent-${{ steps.ver.outputs.name }}-play.aab" \
            --tracks production --production-only \
            --version-name "${{ steps.ver.outputs.name }}" \
            --status "${{ steps.ver.outputs.status }}" \
            --localized-notes "$RUNNER_TEMP/play-notes.json"

      - name: Locate APK inspection tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "AAPT=$BUILD_TOOLS/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"

      - name: Download and verify Google-signed APK
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node apps/mobile/scripts/play-apk.mjs \
            --version-code "${{ steps.ver.outputs.code }}" \
            --version "${{ steps.ver.outputs.name }}" \
            --output "persistent-${{ steps.ver.outputs.name }}-play.apk"

      - name: Add GitHub disclosure
        run: |
          printf '\n*AI disclosure: this comment and the related code were written with the assistance of AI.*\n' >> RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: persistent-*-play.apk
          # The app release is the one "Latest" should mean. Desktop releases pin
          # make_latest: false for the same reason - they interleave with these by
          # date, so whoever shipped most recently would otherwise own /releases/latest,
          # and the README's Android download badge points straight at it.
          make_latest: true
