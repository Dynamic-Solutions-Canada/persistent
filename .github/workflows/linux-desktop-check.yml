name: Linux Desktop Check

on:
  pull_request:
    paths:
      - 'apps/linux-desktop/**'
      - 'apps/web/src/native/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/linux-desktop-check.yml'
  push:
    branches: [main]
    paths:
      - 'apps/linux-desktop/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/linux-desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15 # about 3x the slowest recent run
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build --workspace @persistent/shared
      # Linux Electron tooling uses the same patched runtime as the web/API.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/linux-desktop/package-lock.json
      - run: npm --prefix apps/linux-desktop ci
      # Root tests include the standalone Linux transport tests.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run validate
      # Notices are generated from the x64 closure (devkit-notices); the arm64 build differs only
      # in its native binary packages, so only the x64 leg checks the Linux file.
      - if: matrix.architecture == 'x64'
        run: npx devkit-notices --check --only apps/linux-desktop/THIRD-PARTY-NOTICES.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm run package:linux -- --${{ matrix.architecture }}
      - uses: actions/upload-artifact@v7
        with:
          name: persistent-linux-${{ matrix.architecture }}
          path: |
            apps/linux-desktop/artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7
