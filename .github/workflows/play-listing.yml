name: Play Listing

# Text-only localized titles and descriptions from store-assets/play/listings.json.
# A check discards its edit. Publication preserves screenshots, videos, app details
# and country distribution. Verify review/publication in Play Console separately.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = diff against the live listing and write nothing; publish = push the copy'
        required: true
        default: check
        type: choice
        options: [check, publish]

permissions:
  contents: read

# CI-6: Play allows one open edit per app, so edit-opening workflows queue here, never cancel, and queue: max keeps a waiting release from being dropped.
concurrency:
  group: google-play-edit
  cancel-in-progress: false
  queue: max

jobs:
  # CI-4: play-listing publishes store text, which the code gate says nothing about, so the gate is
  # the offline checks of that text and the code that sends it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:listing

  listing:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # about 3x the slowest recent run
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # No `npm ci`: the script is dependency-free by design (Node 24 has fetch
      # and RS256 signing built in), so this needs nothing from the workspace.
      - name: ${{ inputs.mode == 'publish' && 'Push store listing' || 'Check store listing' }}
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs --listing-json ../../store-assets/play/listings.json \
            ${{ inputs.mode == 'check' && '--check' || '' }}
