name: play-listing

# Text-only localized titles and descriptions from apps/mobile/store/listings.json.
# A check discards its edit. Publication preserves screenshots, videos, app details
# and country distribution. Verify review/publication in Play Console separately.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = diff against the live listing and write nothing; publish = push the copy'
        required: true
        default: check
        type: choice
        options: [check, publish]

permissions:
  contents: read

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.4'

      # No `npm ci`: the script is dependency-free by design (Node 22 has fetch
      # and RS256 signing built in), so this needs nothing from the workspace.
      - name: ${{ inputs.mode == 'publish' && 'Push store listing' || 'Check store listing' }}
        working-directory: apps/mobile
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          node scripts/play-publish.mjs --listing-json store/listings.json \
            ${{ inputs.mode == 'check' && '--check' || '' }}
