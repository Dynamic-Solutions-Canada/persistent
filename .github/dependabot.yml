# Weekly, grouped updates for every ecosystem and manifest directory (HYG-8).
# Gradle is absent on purpose: the Android project is generated into the
# git-ignored apps/mobile/android/ by scripts/setup-android.mjs, which pins its
# versions, so Dependabot never sees a Gradle manifest.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/mobile
      - /apps/linux-desktop
    schedule:
      interval: weekly
    ignore:
      # Major versions move together in the staged stack upgrade (TypeScript, zod,
      # Prisma, React, Vite, ESLint, Capacitor and the rest), one step at a time with
      # its own checks. Remove this rule once that upgrade is done.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # devkit is pinned to a release tag and bumped by hand, following the consumer
      # steps in its release notes. Dependabot misreads its git tags (it proposed
      # v0.20.2 -> v0.17.1).
      - dependency-name: '@dynamic-solutions-canada/devkit'
    groups:
      minor-and-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: nuget
    directories:
      - /apps/desktop/Persistent.Desktop
      - /apps/desktop/Persistent.Widget
      - /apps/desktop/tools/csharp-check
      - /apps/desktop/tools/localization-resources
      - /apps/desktop/tools/localization-tests
    schedule:
      interval: weekly
    ignore:
      # The Windows App SDK line moves with the winui-app-kit adoption (parity package
      # 18), which pins it for every Windows app; the app and the widget are on
      # different lines until then. Remove this rule in that package.
      - dependency-name: 'Microsoft.WindowsAppSDK*'
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
