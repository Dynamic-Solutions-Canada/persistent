# Weekly, grouped updates for every ecosystem and manifest directory (HYG-8).
# The docker entries watch the Dockerfiles and the production compose file (CTR-3);
# Node's version follows .nvmrc and moves with the fleet (PLAT-8), so Dependabot
# never bumps it.
# Gradle is absent on purpose: the Android project is generated into the
# git-ignored apps/mobile/android/ by scripts/setup-android.mjs, which pins its
# versions, so Dependabot never sees a Gradle manifest.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/mobile
      - /apps/linux-desktop
    schedule:
      interval: weekly
    ignore:
      # devkit and web-app-kit are pinned to release tags and bumped by hand, following
      # the consumer steps in their release notes. Dependabot misreads their git tags
      # (it proposed devkit v0.20.2 -> v0.17.1).
      - dependency-name: '@dynamic-solutions-canada/devkit'
      - dependency-name: '@dynamic-solutions-canada/web-app-kit'
    groups:
      npm:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /apps/desktop/Persistent.Desktop
      - /apps/desktop/Persistent.Widget
      - /apps/desktop/tools/csharp-check
      - /apps/desktop/tools/localization-resources
      - /apps/desktop/tools/localization-tests
    schedule:
      interval: weekly
    ignore:
      # The Windows App SDK line moves with the winui-app-kit adoption (parity package
      # 18), which pins it for every Windows app; the app and the widget are on
      # different lines until then. Remove this rule in that package.
      - dependency-name: 'Microsoft.WindowsAppSDK*'
    groups:
      nuget:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/', '/docker/dev']
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
    ignore:
      - dependency-name: node

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-compose:
        patterns: ['*']
    ignore:
      # A Postgres major needs a dump and restore of the live database, so it is a
      # planned deploy, not a weekly update.
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
